name: Autopilot SEO scale

on:
  schedule:
    - cron: "0 3 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot-seo-scale
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate 20 presets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run seed:seo -- --batch=20
      - name: Commit generated presets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated-presets.json
          if git diff --staged --quiet; then
            echo "No preset file changes."
          else
            git commit -m "chore: publish autopilot calculator presets"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Notify IndexNow
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run indexnow
